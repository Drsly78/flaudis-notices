<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Notices Flaudis</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap');
  :root {
    --orange:#E8611A; --bg:#0f0f0f; --surface:#1a1a1a; --surface2:#242424;
    --border:#2e2e2e; --text:#f0f0f0; --muted:#888; --blue:#3b82f6;
    --green:#22c55e; --red:#ef4444;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
  header{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--border);padding:16px 20px 0;}
  .logo{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:3px;color:var(--orange);margin-bottom:14px;display:flex;align-items:center;justify-content:center;gap:10px;}
  .logo span{color:var(--muted);font-size:13px;letter-spacing:1px;font-family:'DM Sans',sans-serif;font-weight:300;margin-top:4px;}
  .search-wrap{position:relative;}
  .search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;}
  #search{width:100%;padding:14px 14px 14px 42px;background:var(--surface);border:1px solid var(--border);border-radius:12px 12px 0 0;color:var(--text);font-family:'DM Sans',sans-serif;font-size:15px;outline:none;}
  #search:focus{border-color:var(--orange);}
  #search::placeholder{color:var(--muted);}
  .search-meta{display:flex;align-items:center;justify-content:space-between;padding:8px 4px 12px;font-size:12px;color:var(--muted);}
  .count-badge{background:var(--orange);color:white;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;}
  #results{padding:8px 16px 40px;}
  .notice-card{margin-bottom:8px;background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;animation:fadeIn 0.2s ease both;}
  .notice-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer;transition:background 0.15s;user-select:none;}
  .notice-main:hover{background:var(--surface2);}
  .notice-icon{width:40px;height:40px;background:linear-gradient(135deg,var(--orange),#FF7A35);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
  .notice-info{flex:1;min-width:0;}
  .notice-ref{font-family:'Bebas Neue',sans-serif;font-size:17px;letter-spacing:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .notice-ref mark{background:none;color:var(--orange);}
  .notice-name{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .card-badges{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-left:auto;margin-right:8px;max-width:150px;justify-content:flex-end;}
  .mini-badge{font-size:10px;font-weight:700;padding:2px 6px;border-radius:6px;white-space:nowrap;}
  .mb-loc{background:rgba(59,130,246,0.2);color:#60a5fa;border:1px solid rgba(59,130,246,0.3);}
  .mb-vis{background:rgba(34,197,94,0.2);color:#4ade80;border:1px solid rgba(34,197,94,0.3);}
  .mb-novis{background:rgba(239,68,68,0.2);color:#f87171;border:1px solid rgba(239,68,68,0.3);}
  .detail-panel{display:none;border-top:1px solid var(--border);}
  .tabs{display:flex;border-bottom:1px solid var(--border);background:#0d0d0d;}
  .tab-btn{flex:1;padding:10px 6px;font-size:12px;font-weight:600;color:var(--muted);background:none;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;border-bottom:2px solid transparent;transition:all 0.15s;}
  .tab-btn.active{color:var(--orange);border-bottom-color:var(--orange);}
  .tab-content{display:none;padding:16px;background:#111;}
  .tab-content.active{display:block;}
  .loc-step{margin-bottom:14px;opacity:0.3;pointer-events:none;transition:opacity 0.2s;}
  .loc-step.on{opacity:1;pointer-events:all;}
  .loc-step-title{font-size:10px;text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-bottom:8px;text-align:center;color:var(--muted);}
  .loc-step-title.active-step{color:var(--orange);}
  .loc-btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
  .loc-btn{padding:10px 14px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface2);color:var(--muted);font-size:14px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all 0.15s;min-width:52px;text-align:center;}
  .loc-btn.sel{background:rgba(59,130,246,0.2);border-color:#3b82f6;color:#60a5fa;box-shadow:0 0 8px rgba(59,130,246,0.25);}
  .loc-summary{font-size:14px;color:#60a5fa;text-align:center;margin-bottom:12px;min-height:20px;font-weight:600;}
  .save-btn{width:100%;padding:12px;border:none;border-radius:10px;font-size:13px;font-weight:700;font-family:'DM Sans',sans-serif;cursor:pointer;transition:all 0.15s;margin-top:4px;}
  .save-btn.orange{background:var(--orange);color:white;}
  .save-btn.green{background:var(--green);color:white;}
  .vis-row{display:flex;gap:12px;margin-bottom:16px;}
  .vis-btn{flex:1;padding:16px;border-radius:12px;border:2px solid var(--border);background:var(--surface2);color:var(--muted);font-size:15px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all 0.15s;text-align:center;}
  .vis-btn.sel-yes{background:rgba(34,197,94,0.15);border-color:var(--green);color:#4ade80;}
  .vis-btn.sel-no{background:rgba(239,68,68,0.15);border-color:var(--red);color:#f87171;}
  .stock-label{font-size:12px;color:var(--muted);text-align:center;margin-bottom:12px;}
  .state{text-align:center;padding:60px 20px;color:var(--muted);}
  .state-icon{font-size:48px;margin-bottom:16px;}
  .state-title{font-size:18px;color:var(--text);margin-bottom:8px;font-weight:500;}
  .loader{display:flex;justify-content:center;padding:60px;}
  .spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--orange);border-radius:50%;animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.5;}}
</style>
</head>
<body>
<header>
  <div style="display:flex;align-items:center;justify-content:center;position:relative;margin-bottom:14px">
    <div class="logo" style="margin-bottom:0">FLAUDIS <span>NOTICES PRODUITS</span></div>
    <button onclick="switchView('plan')" id="nav-plan" style="position:absolute;right:0;width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);color:var(--muted);font-size:18px;cursor:pointer">🗺️</button>
  </div>
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="search" id="search" placeholder="Référence ou nom produit..." autocomplete="off" autocorrect="off" spellcheck="false"/>
  </div>
  <div class="search-meta">
    <span id="search-hint">Chargement…</span>
    <span id="count-badge" class="count-badge" style="display:none"></span>
  </div>
  <div style="display:flex;gap:0;margin-top:4px">
    <button id="nav-notices" onclick="switchView('notices')" style="flex:1;padding:9px;background:var(--orange);color:white;border:none;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:700;cursor:pointer;border-radius:0">📄 Notices</button>
    <button id="nav-reassort" onclick="switchView('reassort')" style="flex:1;padding:9px;background:var(--surface);color:var(--muted);border:none;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:700;cursor:pointer;border-radius:0">🛒 Réassort</button>
  </div>
</header>
<div id="results"><div class="loader"><div class="spinner"></div></div></div>
<div id="plan-panel" style="display:none;padding:12px 10px 40px"></div>
<div id="reassort-panel" style="display:none;padding:16px 16px 40px">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
    <div style="font-size:14px;font-weight:700;color:var(--orange)">🛒 Liste de réassort</div>
    <button onclick="exportReassort()" style="padding:8px 14px;border:none;border-radius:8px;background:var(--orange);color:white;font-size:12px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif">📥 Exporter</button>
  </div>
  <div id="reassort-items" style="background:var(--surface2);border:1px solid var(--border);border-radius:10px;overflow:hidden">
    <div style="padding:20px;text-align:center;color:var(--muted);font-size:13px">Aucun article — ajoutez depuis l'onglet Info des notices</div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey:"AIzaSyCrOySPI0DB-K0BBmc8lG3Z9Jno6j5fcuY",
  authDomain:"flaudis-notices.firebaseapp.com",
  databaseURL:"https://flaudis-notices-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:"flaudis-notices",
  storageBucket:"flaudis-notices.firebasestorage.app",
  messagingSenderId:"1077210292192",
  appId:"1:1077210292192:web:d949dafeb5641b31d35585"
});
const db = firebase.database();

const GITHUB_API = 'https://api.github.com/repos/Drsly78/sav-notices/contents/notices';
const CACHE_KEY  = 'flaudis_notices_v4';
const CACHE_TTL  = 3600000;

let allNotices   = [];
let fbData       = {};
let searchQuery  = '';
let noticesReady = false;
let searchTimer;

// ── Firebase ──────────────────────────────────────────────
db.ref('produits').on('value', snap => {
  fbData = snap.val() || {};
  if (noticesReady) renderAllSoft();
});

function getKey(ref) { return ref.replace(/[.#$\/\[\]]/g,'_'); }

// ── Chargement notices ────────────────────────────────────
async function loadNotices() {
  try {
    const cached = JSON.parse(localStorage.getItem(CACHE_KEY)||'null');
    if (cached && Date.now()-cached.ts < CACHE_TTL) {
      allNotices = cached.data; noticesReady = true; renderAll(); return;
    }
  } catch(e){}
  try {
    const res = await fetch(GITHUB_API);
    if (!res.ok) throw new Error('HTTP '+res.status);
    const files = await res.json();
    allNotices = files
      .filter(f => f.name.toLowerCase().endsWith('.pdf'))
      .map(f => {
        const name = f.name.replace(/\.pdf$/i,'');
        const parts = name.split(' ');
        const ref  = parts[0]||name;
        const year = /^20\d{2}$/.test(parts[parts.length-1]) ? parts[parts.length-1] : null;
        const label= year ? parts.slice(1,-1).join(' ') : parts.slice(1).join(' ');
        return { ref, label:label||ref, year,
          githubUrl:'https://mozilla.github.io/pdf.js/web/viewer.html?file='+encodeURIComponent('https://raw.githubusercontent.com/Drsly78/sav-notices/main/notices/'+encodeURIComponent(f.name)),
          rawUrl:'https://raw.githubusercontent.com/Drsly78/sav-notices/main/notices/'+encodeURIComponent(f.name) };
      })
      .sort((a,b)=>a.ref.localeCompare(b.ref));
    localStorage.setItem(CACHE_KEY, JSON.stringify({ts:Date.now(),data:allNotices}));
    noticesReady = true; renderAll();
  } catch(e) {
    document.getElementById('results').innerHTML =
      '<div class="state"><div class="state-icon">⚠️</div><div class="state-title">Erreur de chargement</div><div style="color:var(--muted);font-size:13px">'+e.message+'</div></div>';
    document.getElementById('search-hint').textContent = 'Erreur';
  }
}

// ── Helpers ───────────────────────────────────────────────
function highlight(text,q) {
  if (!q) return text;
  return text.replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>');
}

function locLabel(d) {
  // Collecter loc, loc2, loc3...
  const slots = ['loc']; let i=2;
  while (d['loc'+i]!==undefined){slots.push('loc'+i);i++;}
  const parts = slots.map(s=>{
    const l=d[s]||{}; if(!l.allee) return null;
    if(l.allee==='SOL') return 'SOL';
    let r='A'+l.allee;
    if(l.cote) r+=' '+l.cote;
    if(l.rack!=null) r+=' R'+l.rack;
    if(l.hauteur!=null) r+=' H'+l.hauteur;
    return r;
  }).filter(Boolean);
  return parts.join(' / ') || null;
}

function pieceBadge(key) {
  const pieces = fbData[key]?.pieces||{};
  const pids = Object.keys(pieces);
  if (!pids.length) return '';
  const fp = pieces[pids[0]];
  const tc = fp.totalCartons||0;
  const oc = Object.keys(fp.cartons||{}).filter(x=>/^c[0-9]+$/.test(x)).length;
  if (!tc&&!oc) return '';
  const col = oc<(tc||oc)?'#fbbf24':'#4ade80';
  return '<span class="mini-badge" style="background:rgba(59,130,246,0.15);color:'+col+'">📦'+oc+(tc?'/'+tc:'')+'</span>';
}

// ── Render ────────────────────────────────────────────────
function renderAll() {
  const q = searchQuery.trim().toLowerCase();
  const filtered = q ? allNotices.filter(n=>n.ref.toLowerCase().includes(q)||n.label.toLowerCase().includes(q)) : allNotices;
  document.getElementById('search-hint').textContent = q ? filtered.length+' résultat(s)' : allNotices.length+' notices';
  const badge = document.getElementById('count-badge');
  badge.textContent = filtered.length; badge.style.display = q?'inline':'none';

  if (!filtered.length) {
    document.getElementById('results').innerHTML = '<div class="state"><div class="state-icon">🔎</div><div class="state-title">Aucun résultat</div></div>';
    return;
  }

  document.getElementById('results').innerHTML = filtered.map((n,i)=>{
    const key = getKey(n.ref);
    const d   = fbData[key]||{};
    const vis = d.visserie;
    const ls  = locLabel(d);
    return `<div class="notice-card" style="animation-delay:${Math.min(i*30,300)}ms" id="card-${key}">
      <div class="notice-main" onclick="togglePanel('${key}')">
        <div class="notice-icon">📄</div>
        <div class="notice-info">
          <div class="notice-ref">${highlight(n.ref,q)}</div>
          ${n.label&&n.label!==n.ref?`<div class="notice-name">${highlight(n.label,q)}${n.year?' · '+n.year:''}</div>`:''}
        </div>
        <div class="card-badges">
          ${ls?`<span class="mini-badge mb-loc">📍 ${ls}</span>`:''}
          ${vis===true?'<span class="mini-badge mb-vis">🔩 Oui</span>':vis===false?'<span class="mini-badge mb-novis">🔩 Non</span>':''}
          ${d.qty!=null&&!d.pieces?`<span class="mini-badge" style="background:rgba(232,97,26,0.2);color:var(--orange);border:1px solid rgba(232,97,26,0.3)">📦 ${d.qty}</span>`:''}
          ${pieceBadge(key)}
          ${isAlertTriggered(key)?'<span class="mini-badge" style="background:rgba(239,68,68,0.2);color:#f87171;border:1px solid rgba(239,68,68,0.3);animation:pulse 1.5s infinite">⚠️ Stock bas</span>':''}
        </div>
        <a href="${n.githubUrl}" target="_blank" onclick="event.stopPropagation()" style="background:var(--orange);color:white;font-size:11px;font-weight:700;padding:6px 10px;border-radius:8px;text-decoration:none;flex-shrink:0">Notice</a>
      </div>
      <div class="detail-panel" id="panel-${key}">
        <div class="tabs">
          <button class="tab-btn active" onclick="showTab('${key}','loc',this)">📍 Emplacement</button>
          <button class="tab-btn" onclick="showTab('${key}','pieces',this)">📦 Pièces</button>
          <button class="tab-btn" onclick="showTab('${key}','inf',this)">ℹ️ Info</button>
        </div>
        <div class="tab-content active" id="tab-loc-${key}" data-lockey="${key}"></div>
        ${renderPiecesTab(key, d.pieces)}
        ${renderInfTab(key, vis)}
      </div>
    </div>`;
  }).join('');

  // Remplir les onglets emplacement — ne recrée jamais les blocs existants
  document.querySelectorAll('[data-lockey]').forEach(el => {
    const key = el.dataset.lockey;
    const d = fbData[key]||{};
    const slots = ['loc']; let si=2; while(d['loc'+si]!==undefined){slots.push('loc'+si);si++;}

    if (!el.querySelector('[id^="locbloc-"]')) {
      // Premier chargement — tout construire
      el.innerHTML = buildLocTab(key);
      return;
    }

    // Supprimer blocs orphelins
    el.querySelectorAll('[id^="locbloc-"]').forEach(b => {
      if (!slots.includes(b.id.replace('locbloc-'+key+'-',''))) b.remove();
    });

    // Ajouter nouveaux slots sans toucher aux existants
    slots.forEach((s, idx) => {
      if (document.getElementById('locbloc-'+key+'-'+s)) return;
      const addBtn = document.getElementById('addbtn-'+key);
      const div = document.createElement('div');
      div.innerHTML = buildLocBloc(key, s, idx, d[s]||{});
      if (addBtn) el.insertBefore(div.firstElementChild, addBtn);
      else el.appendChild(div.firstElementChild);
    });
  });
}

function renderAllSoft() {
  const openKeys={}, openTabs={}, openCartons={};
  document.querySelectorAll('.detail-panel').forEach(p=>{
    if(p.style.display==='block'){
      const key=p.id.replace('panel-','');
      openKeys[key]=true;
      const ab=p.querySelector('.tab-btn.active');
      if(ab) openTabs[key]=ab.textContent.includes('Emplacement')?'loc':ab.textContent.includes('Pièces')?'pieces':'inf';
      // Sauvegarder état ouvert/fermé des cartons
      openCartons[key]={};
      p.querySelectorAll('[id^="cb-"]').forEach(el=>{
        openCartons[key][el.id] = el.style.display !== 'none';
      });
      // Sauvegarder état récap
      const recapEl2 = document.getElementById('recap-'+key);
      if(recapEl2) openCartons[key]['recap-'+key] = recapEl2.style.display !== 'none';
    }
  });
  renderAll();
  Object.keys(openKeys).forEach(key=>{
    const p=document.getElementById('panel-'+key);
    if(!p) return;
    p.style.display='block';
    const tab=openTabs[key]||'loc';
    ['loc','pieces','inf'].forEach(t=>{
      document.getElementById('tab-'+t+'-'+key)?.classList.toggle('active',t===tab);
    });
    p.querySelectorAll('.tab-btn').forEach(btn=>{
      btn.classList.toggle('active',
        (tab==='loc'&&btn.textContent.includes('Emplacement'))||
        (tab==='pieces'&&btn.textContent.includes('Pièces'))||
        (tab==='inf'&&btn.textContent.includes('Info'))
      );
    });
    // Restaurer état des cartons
      const saved = openCartons[key]||{};
      p.querySelectorAll('[id^="cb-"]').forEach(el=>{
        const wasOpen = saved[el.id];
        if(wasOpen === undefined) return;
        el.style.display = wasOpen ? '' : 'none';
      const arr = document.getElementById('arr-'+el.id);
      if(arr) arr.textContent = wasOpen ? '▼' : '▶';
      });
      // Restaurer récap
      const recapEl=document.getElementById('recap-'+key);
      const recapArr=document.getElementById('arr-recap-'+key);
      if(recapEl&&saved['recap-'+key]!==undefined){recapEl.style.display=saved['recap-'+key]?'':'none';if(recapArr)recapArr.textContent=saved['recap-'+key]?'▼':'▶';}
  });
}

// ── Emplacement ───────────────────────────────────────────
function buildLocTab(key) {
  const d=fbData[key]||{};
  const slots=['loc']; let i=2; while(d['loc'+i]!==undefined){slots.push('loc'+i);i++;}
  let html=slots.map((s,idx)=>buildLocBloc(key,s,idx,d[s]||{})).join('');
  html+='<button id="addbtn-'+key+'" data-key="'+key+'" onclick="locAdd(this.dataset.key)" style="width:100%;padding:10px;background:none;border:1.5px dashed var(--border);border-radius:10px;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;font-family:\'DM Sans\',sans-serif;margin-top:4px">+ Ajouter un emplacement</button>';
  return html;
}

function buildLocBloc(key, slotId, idx, loc) {
  const ls=((window._ls||{})[key]||{})[slotId]||{};
  const al=ls.allee!==undefined?ls.allee:(loc.allee||null);
  const co=ls.cote !==undefined?ls.cote :(loc.cote ||null);
  const ra=ls.rack !==undefined?ls.rack :(loc.rack ||null);
  const ha=ls.haut !==undefined?ls.haut :(loc.hauteur??null);
  const coteSol = co==='SOL';
  // Nombre de racks selon allée et côté
  const rackMax = al==='1'?(coteSol?0:co==='G'?4:6):al==='2'?(coteSol?0:4):al==='3'?(coteSol?0:co==='G'?3:4):7;
  const sum = al?(coteSol?'Allée '+al+' · SOL':'Allée '+al+(co?' · '+co:'')+(ra?' · Rack '+ra:'')+(ha!=null?' · H'+ha:'')):'' ;
  const label=sum||('Emplacement '+(idx+1));
  function b(f,v,cur){
    const sel=cur===v||(typeof cur==='number'&&cur===Number(v));
    return '<button class="loc-btn'+(sel?' sel':'')+'" data-key="'+key+'" data-slot="'+slotId+'" data-field="'+f+'" data-val="'+v+'" onclick="locPick(this)">'+v+'</button>';
  }
  const body=
    '<div class="loc-summary">'+(sum?'<b>'+sum+'</b>':'Sélectionnez un emplacement')+'</div>'+
    '<div class="loc-step on"><div class="loc-step-title active-step">Allée</div><div class="loc-btns">'+['1','2','3'].map(v=>b('allee',v,al)).join('')+'</div></div>'+
    '<div class="loc-step'+(al?' on':'')+'"><div class="loc-step-title">Côté</div><div class="loc-btns">'+['G','SOL','D'].map(v=>b('cote',v,co)).join('')+'</div></div>'+
    (coteSol?'':
      '<div class="loc-step'+(co?' on':'')+'"><div class="loc-step-title">Rack</div><div class="loc-btns">'+(rackMax>0?Array.from({length:rackMax},(_,i)=>i+1).map(v=>b('rack',v,ra)).join(''):'')+'</div></div>'+

    '</div>';

}


window.locToggle=function(id){
  const el=document.getElementById(id),arr=document.getElementById(id.replace('locbody-','arrloc-'));
  if(!el)return; const open=el.style.display!=='none';
  el.style.display=open?'none':''; if(arr)arr.textContent=open?'▶':'▼';
};
window.locPick=function(btn){
  const key=btn.dataset.key,slotId=btn.dataset.slot,field=btn.dataset.field;
  const val=['rack','haut'].includes(field)?Number(btn.dataset.val):btn.dataset.val;
  if(!window._ls)window._ls={};
  if(!window._ls[key])window._ls[key]={};
  if(!window._ls[key][slotId])window._ls[key][slotId]={};
  const ls=window._ls[key][slotId];
  ls[field]=ls[field]===val?null:val;
  if(field==='allee'){delete ls.cote;delete ls.rack;delete ls.haut;}
  if(field==='cote'){delete ls.rack;delete ls.haut;}
  if(field==='rack'){delete ls.haut;}
  const bodyEl=document.getElementById('locbody-'+key+'-'+slotId);
  if(!bodyEl)return;
  const d=fbData[key]||{};
  const slots=['loc'];let i=2;while(d['loc'+i]!==undefined){slots.push('loc'+i);i++;}
  const tmp=document.createElement('div');
  tmp.innerHTML=buildLocBloc(key,slotId,slots.indexOf(slotId),d[slotId]||{});
  const nb=tmp.querySelector('[id="locbody-'+key+'-'+slotId+'"]');
  if(nb)bodyEl.innerHTML=nb.innerHTML;
};
window.locSave=function(btn){
  const key=btn.dataset.key,slotId=btn.dataset.slot;
  const d=fbData[key]||{},loc=d[slotId]||{};
  const ls=((window._ls||{})[key]||{})[slotId]||{};
  const al=ls.allee!==undefined?ls.allee:(loc.allee||null);
  const co=ls.cote !==undefined?ls.cote :(loc.cote ||null);
  const ra=ls.rack !==undefined?ls.rack :(loc.rack ||null);
  const ha=ls.haut !==undefined?ls.haut :(loc.hauteur??null);
  btn.textContent='⏳…';btn.disabled=true;
  const nl={};
  if(al)nl.allee=al;
  if(co)nl.cote=co;
  if(co!=='SOL'&&ra!=null)nl.rack=ra;
  if(co!=='SOL'&&ha!=null)nl.hauteur=ha;
  db.ref('produits/'+key+'/'+slotId).set(Object.keys(nl).length?nl:null).then(()=>{
    if(window._ls?.[key])delete window._ls[key][slotId];
    btn.textContent='✓';
    setTimeout(()=>{btn.textContent='💾 Enregistrer';btn.disabled=false;},2000);
  }).catch(()=>{btn.textContent='❌';btn.disabled=false;});
};
window.locDel=function(btn){
  if(!confirm('Supprimer cet emplacement ?'))return;
  const key=btn.dataset.key,slotId=btn.dataset.slot;
  // Supprimer de fbData local pour éviter que renderAllSoft le recréé
  if(fbData[key]) delete fbData[key][slotId];
  document.getElementById('locbloc-'+key+'-'+slotId)?.remove();
  db.ref('produits/'+key+'/'+slotId).remove();
};
window.locAdd=function(key){
  const d=fbData[key]||{};
  let i=2;while(d['loc'+i]!==undefined)i++;
  const newSlot='loc'+i;
  if(!fbData[key])fbData[key]={};
  fbData[key][newSlot]={};
  const tabEl=document.getElementById('tab-loc-'+key);
  const addBtn=document.getElementById('addbtn-'+key);
  if(!tabEl||!addBtn)return;
  const div=document.createElement('div');
  div.innerHTML=buildLocBloc(key,newSlot,i-1,{});
  tabEl.insertBefore(div.firstElementChild,addBtn);
  db.ref('produits/'+key+'/'+newSlot).set({});
};

// ── Pièces ────────────────────────────────────────────────
function sortPids(pieces) {
  return Object.keys(pieces).sort((a,b)=>{
    const na=pieces[a]?.nom||'',nb=pieces[b]?.nom||'';
    const pa=na.match(/^([A-Za-z]+|\d+)/)?.[1]||na,pb2=nb.match(/^([A-Za-z]+|\d+)/)?.[1]||nb;
    const an=/^\d+$/.test(pa),bn=/^\d+$/.test(pb2);
    if(!an&&bn)return -1;if(an&&!bn)return 1;
    if(an&&bn)return parseInt(pa)-parseInt(pb2);
    return pa.localeCompare(pb2,'fr');
  });
}

function renderPiecesTab(key, pieces) {
  pieces=pieces||{};
  const pids=sortPids(pieces);
  const cids=new Set();
  pids.forEach(pid=>Object.keys(pieces[pid].cartons||{}).forEach(cid=>cids.add(cid)));
  // Ne pas afficher les cartons sealed (en réserve) dans l'onglet Pièces
  const cartonIds=Array.from(cids).filter(cid=>{
    if(!cid.startsWith('custom_') && /^c[0-9]+$/.test(cid)){
      return !pids.some(pid=>pieces[pid].cartons?.[cid]?.sealed);
    }
    return true;
  }).sort();
  // curIdx = premier carton non sealed avec des pièces
  const curIdx=cartonIds.findIndex(cid=>
    !pids.some(pid=>pieces[pid].cartons?.[cid]?.sealed) &&
    pids.some(pid=>(pieces[pid].cartons?.[cid]?.qte||0)>0)
  );
  const firstNPid=pids.find(pid=>pieces[pid]?.totalCartons);
  const totalC=firstNPid?pieces[firstNPid].totalCartons:0;

  const cartonsHtml=cartonIds.map((cid,cidx)=>{
    const isCur=cidx===curIdx;
    const isCustom=cid.startsWith('custom_');
    const cartonLabel=isCustom?cid.replace(/^custom_/,'').replace(/_\d+$/,'').replace(/_/g,' ').toUpperCase():'Carton '+(cidx+1);

    const rows=pids.map(pid=>{
      const p=pieces[pid],cart=p.cartons?.[cid];
      if(!cart)return '';
      const qte=cart.qte||0,init=cart.initial||qte,pct=init>0?qte/init:0;
      const col=qte===0?'#f87171':pct<0.3?'#fbbf24':'#4ade80';
      return `<div style="display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid var(--border)">

        <div style="width:50px;height:5px;background:var(--border);border-radius:3px;overflow:hidden"><div style="height:100%;border-radius:3px;width:${Math.round(pct*100)}%;background:${pct>0.5?'var(--green)':pct>0?'#f59e0b':'var(--red)'}"></div></div>
        <span style="font-size:11px;font-weight:700;min-width:32px;text-align:center;color:${col}">${qte}/${init}</span>
        <button onclick="takePiece('${key}','${pid}','${cid}')" ${qte===0?'disabled':''} style="width:28px;height:28px;border-radius:6px;border:1px solid rgba(239,68,68,0.4);background:rgba(239,68,68,0.15);color:#f87171;cursor:pointer;font-size:16px;font-weight:700">−</button>
        <input type="number" id="qty-${key}-${pid}-${cid}" value="1" min="1" style="width:38px;text-align:center;background:var(--surface);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:12px;padding:3px;outline:none"/>
        <button onclick="addPieceQte('${key}','${pid}','${cid}')" style="width:28px;height:28px;border-radius:6px;border:1px solid rgba(34,197,94,0.4);background:rgba(34,197,94,0.15);color:#4ade80;cursor:pointer;font-size:16px;font-weight:700">+</button>
      </div>`;
    }).join('');
    return `<div style="margin-bottom:8px;border:1px solid ${isCur?'var(--orange)':isCustom?'var(--green)':'var(--border)'};border-radius:10px;overflow:hidden;background:var(--surface2)">
      <div style="display:flex;align-items:center;padding:9px 12px;background:${isCur?'rgba(232,97,26,0.1)':''};cursor:pointer" onclick="toggleCarton('${cartonId}')">
        <span style="font-size:12px;font-weight:700;color:${isCur?'var(--orange)':isCustom?'#4ade80':'var(--muted)'}">
          ${isCustom?'📦 ':''}${cartonLabel}${isCur?' ▶ En cours':''}
          ${!isCustom&&totalC>1?'<span style="font-size:10px;color:var(--muted);font-weight:400"> ('+(cidx+1)+'/'+totalC+')</span>':''}
        </span>

          <button onclick="deleteCarton('${key}','${cid}',event)" style="background:none;border:1px solid rgba(239,68,68,0.3);color:#f87171;border-radius:6px;padding:2px 8px;font-size:10px;cursor:pointer;font-family:'DM Sans',sans-serif">✕</button>
        </span>
      </div>
      <div id="${cartonId}" style="padding:0 12px 8px;display:${isOpen?'block':'none'}">${rows}</div>
    </div>`;
  }).join('');

  return `<div class="tab-content" id="tab-pieces-${key}">

  </div>`;

  let recapHtml='';

      const p=pieces[pid];
      const allCids = Object.keys(p.cartons||{}).filter(cid=>/^c[0-9]+$/.test(cid));
      // Total pièces = tous les cartons (ouverts + sealed)
      const realQte = allCids.reduce((s,cid)=>s+((p.cartons?.[cid]?.qte)||0),0);
      // Stock max = initial × totalCartons

function isAlertTriggered(key) {
  const d = fbData[key]||{};
  if(!d.alertEnabled) return false;
  const threshold = d.alertThreshold||1;
  const pieces = d.pieces||{};
  const pids = Object.keys(pieces);
  if(!pids.length) {
    // Produit sans pièces — utiliser qty simple
    return (d.qty||0) <= threshold;
  }
  // Compter les cartons complets (sealed) restants
  const fp = pieces[pids[0]];
  const sealedCount = Object.keys(fp?.cartons||{}).filter(cid=>
    /^c[0-9]+$/.test(cid) && fp.cartons[cid]?.sealed
  ).length;
  return sealedCount <= threshold;
}

window.scanNotice=async function(key){
  const notice=allNotices.find(n=>getKey(n.ref)===key);
  if(!notice)return;
  const btn=document.querySelector('#tab-pieces-'+key+' button[onclick*="scanNotice"]');
  if(btn){btn.textContent='⏳ Analyse…';btn.disabled=true;btn.style.transform='scale(0.95)';}
  try{
    const res=await fetch('https://sav-server-production.up.railway.app/scan-notice',{
      method:'POST',headers:{'Content-Type':'application/json','x-app-secret':'sav-flaudis-2024'},
      body:JSON.stringify({pdfUrl:notice.rawUrl,ref:notice.ref})
    });
    const data=await res.json();
    if(!data.pieces?.length)throw new Error('Aucune pièce trouvée');
    const nb=parseInt(prompt('Combien de cartons au total ?','1'))||1;
    data.pieces.sort((a,b)=>{
      const pa=(a.nom||'').match(/^([A-Za-z]+|\d+)/)?.[1]||(a.nom||'');
      const pb=(b.nom||'').match(/^([A-Za-z]+|\d+)/)?.[1]||(b.nom||'');
      const an=/^\d+$/.test(pa),bn=/^\d+$/.test(pb);
      if(!an&&bn)return -1;if(an&&!bn)return 1;
      if(an&&bn)return parseInt(pa)-parseInt(pb);
      return pa.localeCompare(pb,'fr');
    });
    const existing=(fbData[key]||{}).pieces||{};
    const byNom={};
    Object.entries(existing).forEach(([pid,p])=>{byNom[(p.nom||'').trim().toUpperCase()]=pid;});
    const upd={};
    data.pieces.forEach((p,i)=>{
      const k2=(p.nom||'').trim().toUpperCase();
      const ep=byNom[k2];
      if(ep){
        upd['produits/'+key+'/pieces/'+ep+'/totalCartons']=nb;
        upd['produits/'+key+'/pieces/'+ep+'/initial']=p.qte;
        // Créer les cartons sealed manquants
        const existCartons=existing[ep]?.cartons||{};
        const existNums=Object.keys(existCartons).filter(c=>/^c\d+$/.test(c)).map(c=>parseInt(c.replace('c','')));
        for(let n=2;n<=nb;n++){
          if(!existNums.includes(n)) upd['produits/'+key+'/pieces/'+ep+'/cartons/c'+n]={qte:p.qte,initial:p.qte,sealed:true};
        }
      } else {
        const pid='p'+Date.now()+i;
        const cartons={c1:{qte:p.qte,initial:p.qte}};
        for(let n=2;n<=nb;n++) cartons['c'+n]={qte:p.qte,initial:p.qte,sealed:true};
        upd['produits/'+key+'/pieces/'+pid]={nom:p.nom,initial:p.qte,totalCartons:nb,cartons};
      }
    });
    await db.ref().update(upd);
    if(btn){btn.textContent='✓ '+data.pieces.length+' pièces';btn.style.transform='';}
    setTimeout(()=>{if(btn){btn.textContent='🤖 Scanner IA';btn.disabled=false;}},3000);
  }catch(e){alert('Erreur: '+e.message);if(btn){btn.textContent='🤖 Scanner IA';btn.style.transform='';btn.disabled=false;}}
};

  const nums=Array.from(cids).filter(c=>/^c[0-9]+$/.test(c)).map(c=>parseInt(c.replace('c',''))).sort((a,b)=>a-b);
  const next=(nums[nums.length-1]||0)+1;
  const upd={};
  // sealed:true = carton en réserve, non encore ouvert dans l'onglet Pièces

    upd['produits/'+key+'/pieces/'+pid+'/cartons/c'+next]={qte:init,initial:init,sealed:true};

  const nums=Array.from(cids).filter(c=>/^c[0-9]+$/.test(c)).map(c=>parseInt(c.replace('c',''))).sort((a,b)=>a-b);
  if(nums.length<=1){alert('Il faut garder au moins 1 carton');return;}

  });
  await db.ref().update(upd);
};

  if(currentView==='reassort') renderReassortPanel();
};
window.adjReassortInList = function(key, delta) {
  if(!reassortItems[key]) return;
  reassortItems[key].qty = Math.max(1, reassortItems[key].qty+delta);
  renderReassortPanel();
};
window.removeReassort = function(key) {
  delete reassortItems[key];
  renderReassortPanel();
};
window.exportReassort = function() {
  const keys = Object.keys(reassortItems);
  if(!keys.length){alert('Aucun article dans le réassort');return;}
  let csv = 'R\u00e9f\u00e9rence;Quantit\u00e9\n';
  csv += keys.map(k=>reassortItems[k].ref+';'+reassortItems[k].qty).join('\n');
  const blob = new Blob(['﻿'+csv], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download='reassort_'+new Date().toISOString().slice(0,10)+'.csv';
  a.click(); URL.revokeObjectURL(url);
};

// ── Plan entrepôt ─────────────────────────────────────────
const PLAN_AISLES = [{id:'1',G:4,D:6},{id:'2',G:4,D:4},{id:'3',G:3,D:4}];

function getPlanData() {
  // Construire depuis fbData : { "A1GR2H1": [{ref, label, stock, status}] }
  const planData = {};
  Object.entries(fbData).forEach(([key, d]) => {
    if(!d) return;
    const notice = allNotices.find(n=>getKey(n.ref)===key);
    const ref = notice ? notice.ref : key;
    const label = notice ? notice.label : '';
    // Collecter tous les emplacements loc, loc2...
    const slots = ['loc']; let si=2; while(d['loc'+si]!==undefined){slots.push('loc'+si);si++;}
    slots.forEach(slotId => {
      const loc = d[slotId];
      if(!loc||!loc.allee) return;
      const al = loc.allee, co = loc.cote||'', ra = loc.rack, ha = loc.hauteur;
      let k;
      if(co==='SOL') k = 'A'+al+'SOL';
      else if(co&&ra!=null&&ha!=null) k = 'A'+al+co+'R'+ra+'H'+ha;
      else return;
      if(!planData[k]) planData[k]=[];
      // Stock
      const pieces = d.pieces||{};
      const pids = Object.keys(pieces);
      let stockStr='', status='ok';
      if(pids.length) {
        const fp=pieces[pids[0]];
        const allC=Object.keys(fp.cartons||{}).filter(c=>/^c[0-9]+$/.test(c));
        const tot=allC.reduce((s,c)=>s+((fp.cartons[c]?.qte)||0),0);
        const max=(fp.totalCartons||allC.length)*(fp.initial||0);
        stockStr=tot+'/'+max;
        status = tot===0?'alert':tot<max*0.3?'low':'ok';
      } else if(d.qty!=null) {
        stockStr='Qté: '+d.qty; status='ok';
      }
      if(d.alertEnabled) {
        const sealedC=pids.length?Object.keys(pieces[pids[0]]?.cartons||{}).filter(c=>pieces[pids[0]].cartons[c]?.sealed).length:0;
        if(sealedC<=(d.alertThreshold||1)) status='alert';
      }
      planData[k].push({ref, label, stock:stockStr, status, key});
    });
  });
  return planData;
}

function renderPlan() {
  const panel = document.getElementById('plan-panel');
  const planData = getPlanData();

  function rackStatus(a,side,r) {
    const hs=[0,1,2,3]; let has=false;
    hs.forEach(h=>{ if(planData['A'+a+side+'R'+r+'H'+h]?.length) has=true; });
    return has?'occupied':'empty';
  }
  function rackCount(a,side,r) {
    let n=0; [0,1,2,3].forEach(h=>{n+=(planData['A'+a+side+'R'+r+'H'+h]?.length||0);});
    return n;
  }
  function solStatus(a) {
    return planData['A'+a+'SOL']?.length?'occupied':'empty';
  }

  let html = '<div style="font-family:Bebas Neue,sans-serif;font-size:20px;letter-spacing:3px;color:var(--orange);text-align:center;margin-bottom:12px">PLAN DE L&#39;ENTREPÔT</div>';
  html += '<div style="display:flex;flex-direction:row-reverse;gap:6px;justify-content:center;overflow-x:auto;padding-bottom:4px">';

  PLAN_AISLES.forEach((aisle,ai)=>{
    html += '<div style="flex-shrink:0">';
    html += '<div style="font-family:Bebas Neue,sans-serif;font-size:12px;letter-spacing:2px;color:#4ade80;background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.25);border-radius:6px;padding:5px 0;text-align:center;margin-bottom:6px">ALLÉE '+aisle.id+'</div>';
    html += '<div style="display:flex;gap:4px">';

    ['G','D'].forEach(side=>{
      const maxR = aisle[side];
      html += '<div style="display:flex;flex-direction:column;gap:3px;width:44px">';
      html += '<div style="font-size:9px;text-transform:uppercase;color:var(--muted);text-align:center;margin-bottom:2px;font-weight:700;letter-spacing:1px">'+side+'</div>';

      // Rack SOL (milieu, côté G uniquement pour éviter doublon)
      if(side==='G') {
        const sSt=solStatus(aisle.id);
        const sCnt=planData['A'+aisle.id+'SOL']?.length||0;
        html += '<div data-pa="'+aisle.id+'" data-ps="SOL" onclick="openPlanDetail(this.dataset.pa,this.dataset.ps,0)" style="height:36px;border-radius:7px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border:1.5px solid '+(sSt==='occupied'?'rgba(251,191,36,0.4)':'#242424')+';background:'+(sSt==='occupied'?'rgba(251,191,36,0.1)':'#181818')+';touch-action:manipulation">'+
          '<div style="font-size:8px;font-weight:700;color:'+(sSt==='occupied'?'#fbbf24':'var(--muted)')+'">SOL</div>'+
          (sCnt?'<div style="font-size:9px;font-weight:700;color:#fbbf24">'+sCnt+'P</div>':'')+
        '</div>';
      } else {
        html += '<div style="height:36px;border-radius:7px;background:transparent;border:1.5px solid transparent"></div>';
      }

      for(let r=maxR;r>=1;r--) {
        const st=rackStatus(aisle.id,side,r);
        const cnt=rackCount(aisle.id,side,r);
        html += '<div data-pa="'+aisle.id+'" data-ps="'+side+'" data-pr="'+r+'" onclick="openPlanDetail(this.dataset.pa,this.dataset.ps,this.dataset.pr)" style="height:36px;border-radius:7px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border:1.5px solid '+(st==='occupied'?'rgba(96,165,250,0.4)':'#242424')+';background:'+(st==='occupied'?'rgba(96,165,250,0.08)':'#181818')+';touch-action:manipulation">'+
          '<div style="font-size:9px;font-weight:700;color:'+(st==='occupied'?'rgba(96,165,250,0.7)':'var(--muted)')+'">'+r+'</div>'+
          (cnt?'<div style="font-size:9px;font-weight:700;color:#60a5fa">'+cnt+'P</div>':'')+
        '</div>';
      }
      html += '</div>';
    });

    html += '</div></div>';
    if(ai<PLAN_AISLES.length-1) html += '<div style="width:14px;flex-shrink:0"></div>';
  });

  html += '</div>';
  html += '<div style="margin-top:10px;display:flex;gap:8px;font-size:10px;color:var(--muted);justify-content:center;flex-wrap:wrap">'+
    '<span>🔵 Rack occupé</span><span>🟡 Zone SOL allée</span><span>⬛ Vide</span></div>';

  panel.innerHTML = html;

  // Overlay détail plan
  if(!document.getElementById('plan-overlay')) {
    const ov=document.createElement('div');
    ov.id='plan-overlay';
    ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,0.65);z-index:199;display:none';
    ov.onclick=closePlanDetail;
    document.body.appendChild(ov);
    const dt=document.createElement('div');
    dt.id='plan-detail';
    dt.style.cssText='position:fixed;bottom:0;left:0;right:0;background:#1c1c1c;border-top:2px solid var(--orange);padding:16px 16px 32px;transform:translateY(100%);transition:transform 0.28s cubic-bezier(.32,.72,0,1);z-index:200;max-height:70vh;overflow-y:auto;border-radius:20px 20px 0 0';
    dt.innerHTML='<div style="width:40px;height:4px;border-radius:2px;background:var(--border);margin:0 auto 14px"></div><div id="plan-detail-content"></div>';
    document.body.appendChild(dt);
  }
}

window.openPlanDetail = function(aisle, side, rack) {
  const planData = getPlanData();
  const hs = side==='SOL' ? ['SOL'] : [0,1,2,3];
  let html = '<div style="font-family:Bebas Neue,sans-serif;font-size:18px;letter-spacing:2px;color:var(--orange);margin-bottom:4px">'+
    'Allée '+aisle+(side==='SOL'?' — SOL':' — Côté '+(side==='G'?'Gauche':'Droite')+' — Rack '+rack)+'</div>';

  let anyProd = false;
  if(side==='SOL') {
    const prods=planData['A'+aisle+'SOL']||[];
    if(prods.length){anyProd=true;prods.forEach(p=>{html+=prodRow(p);});}
    else html+='<div style="color:var(--muted);text-align:center;padding:24px 0;font-size:13px">Vide</div>';
  } else {
    const hlabels=['Sol','Bas','Milieu','Haut'];
    let first=true;
    hs.forEach((h,ri)=>{
      const prods=planData['A'+aisle+side+'R'+rack+'H'+h]||[];
      if(!prods.length) return;
      anyProd=true;
      html+='<div style="display:flex;align-items:center;gap:8px;margin:'+(first?'8':'16')+'px 0 8px">'+
        '<div style="flex:1;height:2px;background:rgba(96,165,250,0.5);border-radius:1px"></div>'+
        '<span style="font-size:10px;font-weight:700;color:#60a5fa;background:rgba(96,165,250,0.08);border:1px solid rgba(96,165,250,0.2);border-radius:20px;padding:3px 10px">H'+h+' · '+hlabels[h]+'</span>'+
        '<div style="flex:1;height:2px;background:rgba(96,165,250,0.5);border-radius:1px"></div>'+
      '</div>';
      prods.forEach(p=>{html+=prodRow(p);});
      first=false;
    });
    if(!anyProd) html+='<div style="color:var(--muted);text-align:center;padding:24px 0;font-size:13px">Vide</div>';
  }

  document.getElementById('plan-detail-content').innerHTML=html;
  document.getElementById('plan-overlay').style.display='block';
  document.getElementById('plan-detail').style.transform='translateY(0)';
};

function prodRow(p) {
  const sColors={ok:'rgba(34,197,94,0.15);color:#4ade80',low:'rgba(232,97,26,0.15);color:var(--orange)',alert:'rgba(239,68,68,0.15);color:#f87171'};
  const sc=sColors[p.status]||sColors.ok;
  return '<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)">'+
    '<div style="flex:1"><div style="font-family:Bebas Neue,sans-serif;font-size:16px;letter-spacing:1px">'+p.ref+'</div>'+
    (p.label?'<div style="font-size:11px;color:var(--muted)">'+p.label+'</div>':'')+
    '</div>'+
    '<div style="display:flex;align-items:center;gap:8px">'+
      (p.stock?'<div style="font-size:11px;font-weight:700;padding:4px 8px;border-radius:6px;background:'+sc+'">'+p.stock+'</div>':'')+
      '<button data-k="'+p.key+'" onclick="goToRef(this.dataset.k)" style="font-size:10px;font-weight:700;padding:4px 10px;border-radius:6px;border:1px solid rgba(232,97,26,0.4);background:rgba(232,97,26,0.1);color:var(--orange);cursor:pointer;font-family:DM Sans,sans-serif;white-space:nowrap">→ Notice</button>'+
    '</div>'+
  '</div>';
}

window.goToRef = function(key) {
  closePlanDetail();
  switchView('notices');
  searchQuery = allNotices.find(n=>getKey(n.ref)===key)?.ref||key;
  document.getElementById('search').value = searchQuery;
  renderAll();
  // Ouvrir le panel de la notice
  setTimeout(()=>{
    const card=document.getElementById('card-'+key);
    if(card){card.scrollIntoView({behavior:'smooth',block:'center'});}
    const panel=document.getElementById('panel-'+key);
    if(panel&&panel.style.display!=='block'){togglePanel(key);}
  },200);
};

window.closePlanDetail = function() {
  document.getElementById('plan-overlay').style.display='none';
  document.getElementById('plan-detail').style.transform='translateY(100%)';
};

loadNotices();
