<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Notices Flaudis</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap');
  :root {
    --orange: #E8611A;
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --surface2: #242424;
    --border: #2e2e2e;
    --text: #f0f0f0;
    --muted: #888;
    --blue: #3b82f6;
    --green: #22c55e;
    --red: #ef4444;
    --yellow: #f59e0b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  
  header { position: sticky; top: 0; z-index: 100; background: var(--bg); border-bottom: 1px solid var(--border); padding: 16px 20px 0; }
  .logo { font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 3px; color: var(--orange); margin-bottom: 14px; display: flex; align-items: center; justify-content: center; gap: 10px; }
  .logo span { color: var(--muted); font-size: 13px; font-family: 'DM Sans', sans-serif; font-weight: 300; margin-top: 4px; }
  .search-wrap { position: relative; }
  .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
  #search { width: 100%; padding: 14px 14px 14px 42px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px 12px 0 0; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 15px; outline: none; }
  #search:focus { border-color: var(--orange); }
  #search::placeholder { color: var(--muted); }
  .search-meta { display: flex; align-items: center; justify-content: space-between; padding: 8px 4px 12px; font-size: 12px; color: var(--muted); }
  .count-badge { background: var(--orange); color: white; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  
  #results { padding: 8px 16px 60px; }
  
  .notice-card { margin-bottom: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; animation: fadeIn 0.2s ease both; }
  .notice-main { display: flex; align-items: center; gap: 10px; padding: 12px 14px; cursor: pointer; transition: background 0.15s; }
  .notice-main:hover { background: var(--surface2); }
  .notice-icon { width: 38px; height: 38px; background: linear-gradient(135deg, var(--orange), #FF7A35); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
  .notice-info { flex: 1; min-width: 0; }
  .notice-ref { font-family: 'Bebas Neue', sans-serif; font-size: 16px; letter-spacing: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .notice-ref mark { background: none; color: var(--orange); }
  .notice-name { font-size: 11px; color: var(--muted); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  
  .card-badges { display: flex; gap: 3px; flex-wrap: wrap; justify-content: flex-end; max-width: 120px; }
  .mini-badge { font-size: 9px; font-weight: 700; padding: 2px 5px; border-radius: 5px; white-space: nowrap; }
  .mb-loc   { background: rgba(59,130,246,0.2); color: #60a5fa; }
  .mb-vis   { background: rgba(34,197,94,0.2);  color: #4ade80; }
  .mb-novis { background: rgba(239,68,68,0.2);  color: #f87171; }
  .mb-stock { background: rgba(232,97,26,0.2);  color: #fb923c; }
  .mb-warn  { background: rgba(245,158,11,0.2); color: #fbbf24; }

  .btn-notice { background: var(--orange); color: white; font-size: 11px; font-weight: 700; padding: 6px 10px; border-radius: 8px; text-decoration: none; flex-shrink: 0; white-space: nowrap; border: none; cursor: pointer; font-family: 'DM Sans', sans-serif; }

  .detail-panel { display: none; border-top: 1px solid var(--border); }
  .tabs { display: flex; border-bottom: 1px solid var(--border); background: #0d0d0d; }
  .tab-btn { flex: 1; padding: 10px 4px; font-size: 11px; font-weight: 600; color: var(--muted); background: none; border: none; cursor: pointer; font-family: 'DM Sans', sans-serif; border-bottom: 2px solid transparent; transition: all 0.15s; }
  .tab-btn.active { color: var(--orange); border-bottom-color: var(--orange); }
  .tab-content { display: none; padding: 14px; background: #111; }
  .tab-content.active { display: block; }

  /* EMPLACEMENT */
  .loc-step { margin-bottom: 12px; opacity: 0.35; pointer-events: none; transition: opacity 0.2s; }
  .loc-step.enabled { opacity: 1; pointer-events: all; }
  .loc-step-title { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 7px; text-align: center; color: var(--muted); }
  .loc-step.enabled .loc-step-title { color: var(--orange); }
  .loc-btns { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
  .loc-btn { padding: 9px 12px; border-radius: 10px; border: 1.5px solid var(--border); background: var(--surface2); color: var(--muted); font-size: 13px; font-weight: 700; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.15s; min-width: 46px; text-align: center; }
  .loc-btn.sel { background: rgba(59,130,246,0.2); border-color: #3b82f6; color: #60a5fa; box-shadow: 0 0 8px rgba(59,130,246,0.2); }
  .loc-summary { font-size: 12px; color: var(--muted); text-align: center; margin-bottom: 10px; min-height: 18px; }
  .loc-summary b { color: #60a5fa; }

  /* STOCK & VISSERIE */
  .section-title { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; color: var(--muted); margin-bottom: 8px; }
  .vis-row { display: flex; gap: 10px; margin-bottom: 14px; }
  .vis-btn { flex: 1; padding: 12px; border-radius: 10px; border: 1.5px solid var(--border); background: var(--surface2); color: var(--muted); font-size: 13px; font-weight: 700; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.15s; text-align: center; }
  .vis-btn.sel-yes { background: rgba(34,197,94,0.15); border-color: var(--green); color: #4ade80; }
  .vis-btn.sel-no  { background: rgba(239,68,68,0.15); border-color: var(--red); color: #f87171; }
  .divider { height: 1px; background: var(--border); margin: 14px 0; }

  /* PIÈCES */
  .pieces-section { }
  .piece-item { background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 8px; overflow: hidden; }
  .piece-header { display: flex; align-items: center; padding: 10px 12px; gap: 8px; }
  .piece-name { flex: 1; font-size: 13px; font-weight: 600; }
  .piece-total { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; }
  .pt-ok   { background: rgba(34,197,94,0.2); color: #4ade80; }
  .pt-low  { background: rgba(245,158,11,0.2); color: #fbbf24; }
  .pt-zero { background: rgba(239,68,68,0.2); color: #f87171; }
  .piece-expand { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 16px; padding: 2px 4px; }
  
  .cartons-list { border-top: 1px solid var(--border); padding: 10px 12px; }
  .carton-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; padding: 8px 10px; background: #1a1a1a; border-radius: 8px; border: 1px solid var(--border); }
  .carton-row.current { border-color: var(--orange); }
  .carton-label { font-size: 11px; font-weight: 600; color: var(--muted); flex-shrink: 0; }
  .carton-label.current { color: var(--orange); }
  .carton-bar-wrap { flex: 1; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin: 0 6px; }
  .carton-bar { height: 100%; border-radius: 3px; transition: width 0.3s; }
  .carton-bar.full  { background: var(--green); }
  .carton-bar.mid   { background: var(--yellow); }
  .carton-bar.empty { background: var(--red); }
  .carton-count { font-size: 12px; font-weight: 700; min-width: 40px; text-align: right; }
  .btn-minus { background: var(--surface); border: 1px solid var(--border); color: var(--text); width: 30px; height: 30px; border-radius: 6px; font-size: 16px; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .btn-minus:hover { border-color: var(--orange); color: var(--orange); }
  .btn-minus:disabled { opacity: 0.3; cursor: not-allowed; }

  .btn-open-carton { width: 100%; padding: 10px; background: none; border: 1.5px dashed var(--border); border-radius: 10px; color: var(--muted); font-size: 12px; font-weight: 600; cursor: pointer; font-family: 'DM Sans', sans-serif; margin-top: 4px; transition: all 0.15s; }
  .btn-open-carton:hover { border-color: var(--orange); color: var(--orange); }

  /* AJOUTER PIÈCE */
  .add-piece-form { background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 8px; }
  .form-row { margin-bottom: 8px; }
  .form-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); margin-bottom: 4px; }
  .form-input { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 13px; padding: 8px 10px; outline: none; }
  .form-input:focus { border-color: var(--orange); }
  .form-row-2 { display: flex; gap: 8px; }

  /* BTNS */
  .save-btn { width: 100%; padding: 11px; border: none; border-radius: 10px; font-size: 13px; font-weight: 700; font-family: 'DM Sans', sans-serif; cursor: pointer; transition: all 0.15s; margin-top: 6px; }
  .btn-orange { background: var(--orange); color: white; }
  .btn-green  { background: var(--green);  color: white; }
  .btn-sm { padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface2); color: var(--muted); font-size: 11px; font-weight: 600; cursor: pointer; font-family: 'DM Sans', sans-serif; }
  .btn-sm:hover { border-color: var(--orange); color: var(--orange); }

  /* NOTE */
  .note-textarea { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 13px; padding: 10px; outline: none; resize: vertical; }
  .note-textarea:focus { border-color: var(--orange); }

  .state { text-align: center; padding: 60px 20px; color: var(--muted); }
  .state-icon { font-size: 48px; margin-bottom: 16px; }
  .state-title { font-size: 18px; color: var(--text); margin-bottom: 8px; font-weight: 500; }
  .loader { display: flex; justify-content: center; padding: 60px; }
  .spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--orange); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<header>
  <div class="logo">FLAUDIS <span>NOTICES PRODUITS</span></div>
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="search" id="search" placeholder="Référence ou nom produit..." autocomplete="off" autocorrect="off" spellcheck="false"/>
  </div>
  <div class="search-meta">
    <span id="search-hint">Chargement…</span>
    <span id="count-badge" class="count-badge" style="display:none"></span>
  </div>
</header>
<div id="results"><div class="loader"><div class="spinner"></div></div></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey: "AIzaSyCrOySPI0DB-K0BBmc8lG3Z9Jno6j5fcuY",
  authDomain: "flaudis-notices.firebaseapp.com",
  databaseURL: "https://flaudis-notices-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "flaudis-notices",
  storageBucket: "flaudis-notices.firebasestorage.app",
  messagingSenderId: "1077210292192",
  appId: "1:1077210292192:web:d949dafeb5641b31d35585"
});
const db = firebase.database();

const GITHUB_API = 'https://api.github.com/repos/Drsly78/sav-notices/contents/notices';
const RAW_BASE   = 'https://raw.githubusercontent.com/Drsly78/sav-notices/main/notices/';
const CACHE_KEY  = 'flaudis_v4';
const CACHE_TTL  = 3600000;

let allNotices = [], fbData = {}, searchQuery = '';
let noticesReady = false, fbReady = false;
let openPanels = new Set(), activeTabs = {}, expandedPieces = new Set();

db.ref('produits').on('value', snap => {
  fbData = snap.val() || {};
  fbReady = true;
  if (noticesReady) renderAll();
});

function getKey(ref) { return ref.replace(/[.#$\/\[\]]/g, '_'); }

async function loadNotices() {
  try {
    const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
    if (cached && Date.now() - cached.ts < CACHE_TTL) {
      allNotices = cached.data; noticesReady = true;
      if (fbReady) renderAll(); return;
    }
  } catch(e) {}
  try {
    const res = await fetch(GITHUB_API);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const files = await res.json();
    allNotices = files.filter(f => f.name.toLowerCase().endsWith('.pdf')).map(f => {
      const name = f.name.replace(/\.pdf$/i, '');
      const parts = name.split(' ');
      const ref = parts[0] || name;
      const year = /^20\d{2}$/.test(parts[parts.length-1]) ? parts[parts.length-1] : null;
      const label = year ? parts.slice(1,-1).join(' ') : parts.slice(1).join(' ');
      return { ref, label: label||ref, year, filename: f.name,
        pdfUrl: RAW_BASE + encodeURIComponent(f.name), rawUrl: RAW_BASE + encodeURIComponent(f.name) };
    }).sort((a,b) => a.ref.localeCompare(b.ref));
    localStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), data: allNotices }));
    noticesReady = true; if (fbReady) renderAll();
  } catch(e) {
    document.getElementById('results').innerHTML = `<div class="state"><div class="state-icon">⚠️</div><div class="state-title">Erreur</div><div class="state-sub">${e.message}</div></div>`;
    document.getElementById('search-hint').textContent = 'Erreur';
  }
}

function calcTotal(pieces) {
  if (!pieces) return {};
  const totals = {};
  Object.entries(pieces).forEach(([pid, piece]) => {
    let total = 0;
    if (piece.cartons) Object.values(piece.cartons).forEach(c => { total += (c.qte || 0); });
    totals[pid] = { nom: piece.nom, total, initial: piece.initial || 0 };
  });
  return totals;
}

function locLabel(loc) {
  if (!loc?.allee) return null;
  if (loc.allee === 'SOL') return 'SOL';
  let s = 'A' + loc.allee;
  if (loc.cote) s += ' ' + loc.cote;
  if (loc.rack) s += ' R' + loc.rack;
  if (loc.hauteur !== null && loc.hauteur !== undefined) s += ' H' + loc.hauteur;
  return s;
}

function highlight(text, q) {
  if (!q) return text;
  return text.replace(new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi'), '<mark>$1</mark>');
}

function renderAll() {
  // Sauvegarder état
  document.querySelectorAll('.detail-panel[style*="block"]').forEach(p => openPanels.add(p.id.replace('panel-','')));
  document.querySelectorAll('.piece-item[data-expanded="1"]').forEach(p => expandedPieces.add(p.dataset.pid));

  const q = searchQuery.trim().toLowerCase();
  const filtered = q ? allNotices.filter(n => n.ref.toLowerCase().includes(q) || n.label.toLowerCase().includes(q)) : allNotices;
  document.getElementById('search-hint').textContent = q ? filtered.length + ' résultat(s)' : allNotices.length + ' notices';
  const badge = document.getElementById('count-badge');
  badge.textContent = filtered.length; badge.style.display = q ? 'inline' : 'none';

  if (!filtered.length) {
    document.getElementById('results').innerHTML = `<div class="state"><div class="state-icon">🔎</div><div class="state-title">Aucun résultat</div></div>`;
    return;
  }

  document.getElementById('results').innerHTML = filtered.map((n, i) => {
    const key = getKey(n.ref);
    const d = fbData[key] || {};
    const loc = d.loc || {}, vis = d.visserie, stk = d.stock;
    const pieces = d.pieces || {};
    const totals = calcTotal(pieces);
    const totalPieces = Object.values(totals).reduce((s,t) => s + t.total, 0);
    const hasWarning = Object.values(totals).some(t => t.initial > 0 && t.total === 0);
    const locStr = locLabel(loc);

    return `<div class="notice-card" style="animation-delay:${Math.min(i*30,300)}ms" id="card-${key}">
      <div class="notice-main" onclick="togglePanel('${key}')">
        <div class="notice-icon">📄</div>
        <div class="notice-info">
          <div class="notice-ref">${highlight(n.ref, q)}</div>
          ${n.label && n.label !== n.ref ? `<div class="notice-name">${highlight(n.label, q)}</div>` : ''}
        </div>
        <div class="card-badges">
          ${locStr ? `<span class="mini-badge mb-loc">📍${locStr}</span>` : ''}
          ${vis === true ? `<span class="mini-badge mb-vis">🔩</span>` : vis === false ? `<span class="mini-badge mb-novis">🔩✗</span>` : ''}
          ${hasWarning ? `<span class="mini-badge mb-warn">⚠️</span>` : ''}
        </div>
        <a href="https://mozilla.github.io/pdf.js/web/viewer.html?file=${encodeURIComponent(n.rawUrl)}" target="_blank" onclick="event.stopPropagation()" class="btn-notice">Notice</a>
      </div>
      <div class="detail-panel" id="panel-${key}">
        <div class="tabs">
          <button class="tab-btn active" onclick="showTab('${key}','loc',this)">📍 Emplacement</button>
          <button class="tab-btn" onclick="showTab('${key}','pieces',this)">📦 Pièces</button>
          <button class="tab-btn" onclick="showTab('${key}','inf',this)">ℹ️ Info</button>
        </div>
        ${buildLocTab(key, d.loc, d._locstate)}
        ${buildPiecesTab(key, pieces)}
        ${buildInfTab(key, vis, d.note)}
      </div>
    </div>`;
  }).join('');

  // Restaurer
  openPanels.forEach(key => {
    const p = document.getElementById('panel-' + key);
    if (p) p.style.display = 'block';
    const tab = activeTabs[key] || 'loc';
    ['loc','pieces','inf'].forEach(t => {
      document.getElementById('tab-' + t + '-' + key)?.classList.toggle('active', t === tab);
    });
    p?.querySelectorAll('.tab-btn').forEach((btn,i) => {
      btn.classList.toggle('active', i === ['loc','pieces','inf'].indexOf(tab));
    });
  });
}

// ── EMPLACEMENT ───────────────────────────────────────────
function buildLocTab(key, loc, ls) {
  ls = ls || {};
  const al = ls.allee ?? loc?.allee ?? null;
  const co = ls.cote  ?? loc?.cote  ?? null;
  const ra = ls.rack  ?? loc?.rack  ?? null;
  const ha = ls.haut  ?? (loc?.hauteur !== undefined ? loc.hauteur : null);
  const isSol = al === 'SOL';
  let summary = '';
  if (al) { summary = al === 'SOL' ? 'SOL' : 'Allée ' + al + (co?' · '+co:'') + (ra?' · Rack '+ra:'') + (ha!==null?' · H'+ha:''); }

  return `<div class="tab-content active" id="tab-loc-${key}">
    <div class="loc-summary">${summary ? `<b>${summary}</b>` : 'Sélectionnez un emplacement'}</div>
    <div class="loc-step enabled">
      <div class="loc-step-title">Allée</div>
      <div class="loc-btns">
        ${['1','2','3','SOL'].map(v=>`<button class="loc-btn${al===v?' sel':''}" onclick="pickLoc('${key}','allee','${v}')">${v}</button>`).join('')}
      </div>
    </div>
    <div class="loc-step${!isSol&&al?' enabled':''}">
      <div class="loc-step-title">Côté</div>
      <div class="loc-btns">
        ${['G','D'].map(v=>`<button class="loc-btn${co===v?' sel':''}" onclick="pickLoc('${key}','cote','${v}')">${v}</button>`).join('')}
      </div>
    </div>
    <div class="loc-step${!isSol&&co?' enabled':''}">
      <div class="loc-step-title">Rack</div>
      <div class="loc-btns">
        ${[1,2,3,4,5,6,7].map(v=>`<button class="loc-btn${ra===v?' sel':''}" onclick="pickLoc('${key}','rack',${v})">${v}</button>`).join('')}
      </div>
    </div>
    <div class="loc-step${!isSol&&ra!==null&&ra!==undefined?' enabled':''}">
      <div class="loc-step-title">Hauteur</div>
      <div class="loc-btns">
        ${[0,1,2,3].map(v=>`<button class="loc-btn${ha===v?' sel':''}" onclick="pickLoc('${key}','haut',${v})">${v}</button>`).join('')}
      </div>
    </div>
    <button class="save-btn btn-orange" onclick="saveLoc('${key}')">💾 Enregistrer</button>
  </div>`;
}

window.pickLoc = function(key, field, val) {
  const d = fbData[key] || {};
  if (!d._locstate) d._locstate = {};
  const ls = d._locstate;
  ls[field] = ls[field] === val ? null : val;
  if (field === 'allee') { delete ls.cote; delete ls.rack; delete ls.haut; }
  if (field === 'cote')  { delete ls.rack; delete ls.haut; }
  if (field === 'rack')  { delete ls.haut; }
  fbData[key] = d;
  const tabEl = document.getElementById('tab-loc-' + key);
  if (tabEl) { const newEl = document.createElement('div'); newEl.innerHTML = buildLocTab(key, d.loc, ls); tabEl.replaceWith(newEl.firstChild); }
};

window.saveLoc = async function(key) {
  const d = fbData[key] || {};
  const ls = d._locstate || {};
  const loc = d.loc || {};
  const al = ls.allee ?? loc.allee ?? null;
  const co = ls.cote  ?? loc.cote  ?? null;
  const ra = ls.rack  ?? loc.rack  ?? null;
  const ha = ls.haut  ?? (loc.hauteur !== undefined ? loc.hauteur : null);
  const btn = document.querySelector(`#tab-loc-${key} .save-btn`);
  if (btn) { btn.textContent = '⏳…'; btn.disabled = true; }
  try {
    const newLoc = {};
    if (al) newLoc.allee = al;
    if (al !== 'SOL' && co) newLoc.cote = co;
    if (al !== 'SOL' && ra !== null && ra !== undefined) newLoc.rack = ra;
    if (al !== 'SOL' && ha !== null && ha !== undefined) newLoc.hauteur = ha;
    await db.ref('produits/' + key + '/loc').set(Object.keys(newLoc).length ? newLoc : null);
    delete d._locstate;
    feedback(btn, '✓ Enregistré !', true);
  } catch(e) { if (btn) { btn.textContent = '❌ Erreur'; btn.disabled = false; } }
};

// ── PIÈCES (par carton) ──────────────────────────────────
function buildPiecesTab(key, pieces) {
  const pids = Object.keys(pieces || {});
  // Trouver tous les cartons distincts
  const allCartonIds = new Set();
  pids.forEach(pid => { Object.keys(pieces[pid].cartons || {}).forEach(cid => allCartonIds.add(cid)); });
  const cartonIds = Array.from(allCartonIds).sort();

  const cartonsHtml = cartonIds.map((cid, cidx) => {
    const isCurrent = cidx === cartonIds.findIndex(id => pids.some(pid => (pieces[pid].cartons?.[id]?.qte || 0) > 0));
    // Vérifier si le carton est fermé
    const isClosed = pids.some(pid => pieces[pid].cartons?.[cid]?.closed === true);

    const cartonPieces = pids.map(pid => {
      const p = pieces[pid];
      const c2 = p.cartons?.[cid];
      if (!c2) return '';
      const qte = c2.qte || 0;
      const init = c2.initial || qte;
      const pct = init > 0 ? qte/init : 0;
      const cls = qte === 0 ? 'pt-zero' : pct < 0.3 ? 'pt-low' : 'pt-ok';
      return `<div class="carton-row" style="opacity:${isClosed?0.5:1}">
        <button class="btn-minus" onclick="addPieceToCarton('${key}','${pid}','${cid}')" ${isClosed?'disabled':''} style="background:rgba(34,197,94,0.1);border-color:rgba(34,197,94,0.3);color:#4ade80">+</button>
        <span style="font-size:11px;flex:1;text-align:center;color:var(--text)">${p.nom || pid}</span>
        <div class="carton-bar-wrap"><div class="carton-bar ${pct>0.5?'full':pct>0?'mid':'empty'}" style="width:${Math.round(pct*100)}%"></div></div>
        <span class="carton-count ${cls}">${qte}/${init}</span>
        <button class="btn-minus" onclick="takePiece('${key}','${pid}','${cid}')" ${qte===0||isClosed?'disabled':''}>−</button>
      </div>`;
    }).join('');;

    return `<div class="piece-item" id="carton-${key}-${cid}" style="margin-bottom:8px;border:1px solid ${isCurrent?'var(--orange)':'var(--border)'};border-radius:10px;overflow:hidden;background:var(--surface2)">
      <div style="display:flex;align-items:center;padding:10px 12px;background:${isClosed?'rgba(0,0,0,0.2)':isCurrent?'rgba(232,97,26,0.1)':'transparent'}">
        <span style="font-size:12px;font-weight:700;color:${isClosed?'var(--muted)':isCurrent?'var(--orange)':'var(--muted)'}">
          Carton ${cidx+1}${isClosed?' 🔒 Fermé':isCurrent?' ▶ En cours':''}
        </span>
        <span style="margin-left:auto;display:flex;gap:6px;align-items:center">
          ${isClosed 
            ? `<button onclick="openCartonAgain('${key}','${cid}',event)" style="background:none;border:1px solid rgba(34,197,94,0.3);color:#4ade80;border-radius:6px;padding:2px 8px;font-size:10px;cursor:pointer;font-family:'DM Sans',sans-serif">↩ Rouvrir</button>`
            : `<button onclick="closeCarton('${key}','${cid}',event)" style="background:none;border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:2px 8px;font-size:10px;cursor:pointer;font-family:'DM Sans',sans-serif">🔒 Fermer</button>`
          }
          <button onclick="deleteCarton('${key}','${cid}',event)" style="background:none;border:1px solid rgba(239,68,68,0.3);color:#f87171;border-radius:6px;padding:2px 8px;font-size:10px;cursor:pointer;font-family:'DM Sans',sans-serif">🗑</button>
        </span>
      </div>
      <div style="padding:0 12px 10px">${cartonPieces}</div>
    </div>`;
  }).join('');

  // Liste des pièces pour ce produit (pour le formulaire d'ajout)
  const piecesListHtml = pids.length ? pids.map(pid => {
    const p = pieces[pid];
    const total = Object.values(p.cartons||{}).reduce((s,c2)=>s+(c2.qte||0),0);
    return `<div style="display:flex;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);font-size:12px">
      <span style="flex:1;color:var(--text)">${p.nom||pid}</span>
      <span style="color:var(--muted)">${total} pcs total</span>
    </div>`;
  }).join('') : '';

  return `<div class="tab-content" id="tab-pieces-${key}">
    ${cartonIds.length ? cartonsHtml : '<div style="color:var(--muted);font-size:13px;text-align:center;padding:20px 0">Aucune pièce — scannez ou ajoutez manuellement</div>'}
    
    <button class="btn-open-carton" onclick="openCarton('${key}',event)" style="margin-top:4px">+ Ouvrir un nouveau carton</button>
    
    <div style="margin-top:12px;display:flex;gap:8px">
      <button class="btn-sm" style="flex:1" onclick="showAddPiece('${key}')">+ Ajouter une pièce</button>
      <button class="btn-sm" style="flex:1;border-color:var(--blue);color:#60a5fa" onclick="scanNotice('${key}')">🤖 Scanner IA</button>
    </div>
    
    <div id="add-piece-${key}" style="display:none;margin-top:8px">
      <div class="add-piece-form">
        <div class="form-row">
          <div class="form-label">Nom / N° pièce</div>
          <input class="form-input" id="ap-nom-${key}" placeholder="ex: Mât principal, Vis M6..."/>
        </div>
        <div class="form-row-2">
          <div class="form-row" style="flex:1">
            <div class="form-label">Qté / carton</div>
            <input class="form-input" type="number" id="ap-qte-${key}" placeholder="8" min="1"/>
          </div>
          <div class="form-row" style="flex:1">
            <div class="form-label">Nb cartons</div>
            <input class="form-input" type="number" id="ap-nb-${key}" placeholder="3" min="1"/>
          </div>
        </div>
        <button class="save-btn btn-orange" onclick="addPiece('${key}')">Ajouter</button>
      </div>
    </div>
  </div>`;
}

// ── INFO ──────────────────────────────────────────────────
function buildInfTab(key, vis, note) {
  const d = fbData[key] || {};
  const pieces = d.pieces || {};
  const pids = Object.keys(pieces);
  const allCartonIds = new Set();
  pids.forEach(pid => Object.keys(pieces[pid].cartons||{}).forEach(cid => allCartonIds.add(cid)));
  const nbCartons = allCartonIds.size;

  const recapHtml = pids.length ? `
    <div class="section-title" style="margin-bottom:8px">Récapitulatif stock</div>
    <div style="background:var(--surface2);border-radius:8px;padding:10px;margin-bottom:12px;font-size:12px">
      <div style="display:flex;justify-content:space-between;color:var(--muted);margin-bottom:6px;font-size:10px;text-transform:uppercase;letter-spacing:0.5px">
        <span>Pièce</span><span>/ carton × ${nbCartons} = Total</span>
      </div>
      ${pids.map(pid => {
        const p = pieces[pid];
        const perCarton = p.initial || 0;
        const total = Object.values(p.cartons||{}).reduce((s,c2)=>s+(c2.qte||0),0);
        const cls = total === 0 ? 'color:var(--red)' : total < perCarton ? 'color:var(--yellow)' : 'color:var(--green)';
        return `<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border)">
          <span>${p.nom||pid}</span>
          <span style="${cls};font-weight:700">${perCarton} × ${nbCartons} = ${total}</span>
        </div>`;
      }).join('')}
    </div>
  ` : '';

  return `<div class="tab-content" id="tab-inf-${key}">
    <div class="section-title">Visserie disponible</div>
    <div class="vis-row">
      <button class="vis-btn${vis===true?' sel-yes':''}" id="vis-oui-${key}" onclick="saveVis('${key}',true)">✅ Oui</button>
      <button class="vis-btn${vis===false?' sel-no':''}"  id="vis-non-${key}" onclick="saveVis('${key}',false)">❌ Non</button>
    </div>
    <div class="divider"></div>
    ${recapHtml}
    <div class="section-title">Note</div>
    <textarea class="note-textarea" id="note-${key}" rows="3" placeholder="Notes libres…">${note||''}</textarea>
    <button class="save-btn btn-orange" onclick="saveNote('${key}')">💾 Enregistrer la note</button>
  </div>`;
}

window.saveVis = async function(key, val) {
  document.getElementById('vis-oui-' + key).className = 'vis-btn' + (val===true?' sel-yes':'');
  document.getElementById('vis-non-' + key).className = 'vis-btn' + (val===false?' sel-no':'');
  await db.ref('produits/' + key + '/visserie').set(val);
};

window.saveNote = async function(key) {
  const val = document.getElementById('note-' + key)?.value || '';
  const btn = document.querySelector(`#tab-inf-${key} .save-btn`);
  if (btn) { btn.textContent = '⏳…'; btn.disabled = true; }
  try {
    await db.ref('produits/' + key + '/note').set(val || null);
    feedback(btn, '✓ Enregistré !', true);
  } catch(e) { if (btn) { btn.textContent = '❌'; btn.disabled = false; } }
};

// ── CARTONS ──────────────────────────────────────────────
window.closeCarton = async function(key, cid, e) {
  e.stopPropagation();
  // Fermer = marquer comme fermé, stock conservé
  const d = fbData[key] || {};
  const pieces = Object.keys(d.pieces || {});
  const updates = {};
  pieces.forEach(pid => {
    updates['produits/' + key + '/pieces/' + pid + '/cartons/' + cid + '/closed'] = true;
  });
  await db.ref().update(updates);
};

window.openCartonAgain = async function(key, cid, e) {
  e.stopPropagation();
  const d = fbData[key] || {};
  const pieces = Object.keys(d.pieces || {});
  const updates = {};
  pieces.forEach(pid => {
    updates['produits/' + key + '/pieces/' + pid + '/cartons/' + cid + '/closed'] = null;
  });
  await db.ref().update(updates);
};

window.deleteCarton = async function(key, cid, e) {
  e.stopPropagation();
  if (!confirm('Supprimer définitivement ce carton ?')) return;
  const d = fbData[key] || {};
  const pieces = Object.keys(d.pieces || {});
  const updates = {};
  pieces.forEach(pid => {
    updates['produits/' + key + '/pieces/' + pid + '/cartons/' + cid] = null;
  });
  await db.ref().update(updates);
};

window.openCarton = async function(key, e) {
  e.stopPropagation();
  const d = fbData[key] || {};
  const pieces = d.pieces || {};
  const pids = Object.keys(pieces);
  if (!pids.length) { alert('Ajoutez d\'abord des pièces'); return; }
  const allIds = new Set();
  pids.forEach(pid => Object.keys(pieces[pid].cartons||{}).forEach(cid => allIds.add(cid)));
  const newId = 'c' + (allIds.size + 1);
  const updates = {};
  pids.forEach(pid => {
    const initial = pieces[pid].initial || 0;
    updates['produits/' + key + '/pieces/' + pid + '/cartons/' + newId] = { qte: initial, initial };
  });
  await db.ref().update(updates);
};

// ── SCAN IA ──────────────────────────────────────────────
window.scanNotice = async function(key) {
  const notice = allNotices.find(n => getKey(n.ref) === key);
  if (!notice) return;
  const btn = document.querySelector(`#tab-pieces-${key} .btn-sm:last-child`);
  if (btn) { btn.textContent = '⏳ Scan…'; btn.disabled = true; }
  try {
    const res = await fetch('https://sav-server-production.up.railway.app/scan-notice', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-app-secret': 'sav-flaudis-2024' },
      body: JSON.stringify({ pdfUrl: notice.rawUrl, ref: notice.ref })
    });
    const data = await res.json();
    if (!data.pieces || !data.pieces.length) throw new Error('Aucune pièce trouvée');
    // Demander la quantité de cartons
    const nbCartons = parseInt(prompt('Combien de cartons avez-vous ?', '1')) || 1;
    const updates = {};
    data.pieces.forEach((p, i) => {
      const pid = 'p' + Date.now() + i;
      const cartons = {};
      for (let j = 1; j <= nbCartons; j++) cartons['c' + j] = { qte: p.qte, initial: p.qte };
      updates[`produits/${key}/pieces/${pid}`] = { nom: p.nom, initial: p.qte, cartons };
    });
    await db.ref().update(updates);
    if (btn) { btn.textContent = '✓ ' + data.pieces.length + ' pièces'; }
    setTimeout(() => { if(btn){btn.textContent='🤖 Scanner IA';btn.disabled=false;} }, 3000);
  } catch(e) {
    alert('Erreur scan : ' + e.message);
    if (btn) { btn.textContent = '🤖 Scanner IA'; btn.disabled = false; }
  }
};

// ── UTILS ─────────────────────────────────────────────────
window.togglePanel = function(key) {
  const p = document.getElementById('panel-' + key);
  if (!p) return;
  const open = p.style.display === 'block';
  p.style.display = open ? 'none' : 'block';
  if (open) openPanels.delete(key); else openPanels.add(key);
};

window.togglePiece = function(key, pid) {
  // Non utilisé dans la nouvelle version par carton
};

window.showAddPiece = function(key) {
  const el = document.getElementById('add-piece-' + key);
  if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
};

window.addPiece = async function(key) {
  const nom = document.getElementById('ap-nom-' + key)?.value.trim();
  const qte = parseInt(document.getElementById('ap-qte-' + key)?.value) || 0;
  const nb  = parseInt(document.getElementById('ap-nb-'  + key)?.value) || 1;
  if (!nom || qte <= 0) { alert('Remplissez le nom et la quantité par carton'); return; }
  const pid = 'p' + Date.now();
  const cartons = {};
  for (let i = 1; i <= nb; i++) cartons['c' + i] = { qte, initial: qte };
  try {
    await db.ref('produits/' + key + '/pieces/' + pid).set({ nom, initial: qte, cartons });
    document.getElementById('ap-nom-' + key).value = '';
    document.getElementById('ap-qte-' + key).value = '';
    document.getElementById('ap-nb-'  + key).value = '';
  } catch(e) { alert('Erreur : ' + e.message); }
};

window.takePiece = async function(key, pid, cid) {
  const d = fbData[key] || {};
  const current = d.pieces?.[pid]?.cartons?.[cid]?.qte || 0;
  if (current <= 0) return;
  await db.ref('produits/' + key + '/pieces/' + pid + '/cartons/' + cid + '/qte').set(current - 1);
};

window.addPieceToCarton = async function(key, pid, cid) {
  const d = fbData[key] || {};
  const current = d.pieces?.[pid]?.cartons?.[cid]?.qte || 0;
  await db.ref('produits/' + key + '/pieces/' + pid + '/cartons/' + cid + '/qte').set(current + 1);
};

window.showTab = function(key, tab, btn) {
  ['loc','pieces','inf'].forEach(t => document.getElementById('tab-' + t + '-' + key)?.classList.toggle('active', t === tab));
  btn.closest('.tabs').querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeTabs[key] = tab;
};

function feedback(btn, msg, ok) {
  if (!btn) return;
  btn.textContent = msg;
  if (ok) btn.classList.replace('btn-orange','btn-green');
  setTimeout(() => { btn.textContent = '💾 Enregistrer'; btn.classList.replace('btn-green','btn-orange'); btn.disabled = false; }, 2000);
}

let t;
document.getElementById('search').addEventListener('input', e => {
  clearTimeout(t); searchQuery = e.target.value; t = setTimeout(renderAll, 100);
});

loadNotices();
</script>
