<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="theme-color" content="#1a1a1a"/>
<title>Notices Flaudis</title>
<link rel="manifest" href="#"/>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap');

  :root {
    --orange: #E8611A;
    --orange-light: #FF7A35;
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --surface2: #242424;
    --border: #2e2e2e;
    --text: #f0f0f0;
    --muted: #888;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* HEADER */
  header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 16px 20px 0;
  }

  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    letter-spacing: 3px;
    color: var(--orange);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo span {
    color: var(--muted);
    font-size: 13px;
    letter-spacing: 1px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    margin-top: 4px;
  }

  .search-wrap {
    position: relative;
    margin-bottom: 0;
  }

  .search-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 16px;
    pointer-events: none;
  }

  #search {
    width: 100%;
    padding: 14px 14px 14px 42px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px 12px 0 0;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s;
  }

  #search:focus {
    border-color: var(--orange);
  }

  #search::placeholder { color: var(--muted); }

  .search-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 4px 12px;
    font-size: 12px;
    color: var(--muted);
  }

  .count-badge {
    background: var(--orange);
    color: white;
    padding: 2px 8px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
  }

  /* LISTE */
  #results {
    padding: 8px 16px 40px;
  }

  .notice-card {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    margin-bottom: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.15s;
    text-decoration: none;
    color: inherit;
    animation: fadeIn 0.2s ease both;
  }

  .notice-card:hover, .notice-card:active {
    background: var(--surface2);
    border-color: var(--orange);
    transform: translateX(3px);
  }

  .notice-icon {
    width: 40px;
    height: 40px;
    background: linear-gradient(135deg, var(--orange), var(--orange-light));
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }

  .notice-info { flex: 1; min-width: 0; }

  .notice-ref {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 17px;
    letter-spacing: 1px;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .notice-ref mark {
    background: none;
    color: var(--orange);
  }

  .notice-name {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .notice-arrow {
    color: var(--muted);
    font-size: 14px;
    flex-shrink: 0;
  }

  /* ÉTATS */
  .state {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }

  .state-icon { font-size: 48px; margin-bottom: 16px; }
  .state-title { font-size: 18px; color: var(--text); margin-bottom: 8px; font-weight: 500; }
  .state-sub { font-size: 13px; line-height: 1.5; }

  /* LOADER */
  .loader {
    display: flex;
    justify-content: center;
    padding: 60px;
  }

  .spinner {
    width: 32px;
    height: 32px;
    border: 3px solid var(--border);
    border-top-color: var(--orange);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  /* REFRESH */
  .refresh-btn {
    position: fixed;
    bottom: 24px;
    right: 20px;
    width: 48px;
    height: 48px;
    background: var(--orange);
    border: none;
    border-radius: 50%;
    color: white;
    font-size: 18px;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(232, 97, 26, 0.4);
    transition: transform 0.2s;
    z-index: 50;
  }

  .refresh-btn:hover { transform: rotate(180deg) scale(1.1); }
  .refresh-btn.spinning { animation: spin 0.6s linear; }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* PWA install banner */
  #install-banner {
    display: none;
    margin: 12px 16px 0;
    padding: 12px 16px;
    background: linear-gradient(135deg, #1e1e1e, #242424);
    border: 1px solid var(--orange);
    border-radius: 10px;
    font-size: 13px;
    align-items: center;
    gap: 12px;
  }

  #install-banner button {
    margin-left: auto;
    background: var(--orange);
    border: none;
    color: white;
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    white-space: nowrap;
    font-family: 'DM Sans', sans-serif;
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    FLAUDIS <span>NOTICES PRODUITS</span>
  </div>
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="search" id="search" placeholder="Référence ou nom produit..." autocomplete="off" autocorrect="off" spellcheck="false"/>
  </div>
  <div class="search-meta">
    <span id="search-hint">Tapez pour rechercher</span>
    <span id="count-badge" class="count-badge" style="display:none"></span>
  </div>
</header>

<div id="install-banner">
  📲 Installer l'app sur cet appareil
  <button id="install-btn">Installer</button>
</div>

<div id="results">
  <div class="loader"><div class="spinner"></div></div>
</div>

<button class="refresh-btn" id="refresh-btn" title="Actualiser">↻</button>

<script>
const GITHUB_API = 'https://api.github.com/repos/Drsly78/sav-notices/contents/notices';
const GITHUB_RAW = 'https://raw.githubusercontent.com/Drsly78/sav-notices/main/notices/';
const CACHE_KEY = 'flaudis_notices_cache';
const CACHE_TTL = 3600000; // 1h

let allNotices = [];
let searchQuery = '';
let deferredPrompt = null;

// PWA install
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('install-banner').style.display = 'flex';
});

document.getElementById('install-btn').onclick = async () => {
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;
  deferredPrompt = null;
  document.getElementById('install-banner').style.display = 'none';
};

// Charger les notices depuis GitHub API
async function loadNotices(forceRefresh = false) {
  // Vérifier cache
  if(!forceRefresh){
    try {
      const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
      if(cached && Date.now() - cached.ts < CACHE_TTL){
        allNotices = cached.data;
        renderAll();
        return;
      }
    } catch(e){}
  }

  showLoader();
  try {
    const res = await fetch(GITHUB_API);
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const files = await res.json();

    allNotices = files
      .filter(f => f.name.toLowerCase().endsWith('.pdf'))
      .map(f => {
        const name = f.name.replace(/\.pdf$/i, '');
        const parts = name.split(' ');
        // Premier bloc = référence, reste = nom produit
        const ref = parts[0] || name;
        const label = parts.slice(1).join(' ');
        const year = /^20\d{2}$/.test(parts[parts.length-1]) ? parts[parts.length-1] : null;
        const productName = year
          ? parts.slice(1, -1).join(' ')
          : parts.slice(1).join(' ');
        return {
          filename: f.name,
          fullname: name,
          ref: ref,
          label: productName || ref,
          year: year,
          url: GITHUB_RAW + encodeURIComponent(f.name),
          githubUrl: 'https://github.com/Drsly78/sav-notices/blob/main/notices/' + encodeURIComponent(f.name)
        };
      })
      .sort((a, b) => a.ref.localeCompare(b.ref));

    // Sauvegarder cache
    localStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), data: allNotices }));
    renderAll();
  } catch(e) {
    showError(e.message);
  }
}

function showLoader(){
  document.getElementById('results').innerHTML = '<div class="loader"><div class="spinner"></div></div>';
  document.getElementById('search-hint').textContent = 'Chargement…';
  document.getElementById('count-badge').style.display = 'none';
}

function showError(msg){
  document.getElementById('results').innerHTML = `
    <div class="state">
      <div class="state-icon">⚠️</div>
      <div class="state-title">Impossible de charger les notices</div>
      <div class="state-sub">${msg}<br><br>Vérifiez votre connexion et réessayez.</div>
    </div>`;
  document.getElementById('search-hint').textContent = 'Erreur de chargement';
}

function highlight(text, query){
  if(!query) return text;
  const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return text.replace(new RegExp('(' + escaped + ')', 'gi'), '<mark>$1</mark>');
}

function filterNotices(query){
  if(!query) return allNotices;
  const q = query.toLowerCase();
  return allNotices.filter(n =>
    n.ref.toLowerCase().includes(q) ||
    n.label.toLowerCase().includes(q) ||
    n.fullname.toLowerCase().includes(q)
  );
}

function renderAll(){
  const query = searchQuery.trim();
  const filtered = filterNotices(query);
  const container = document.getElementById('results');
  const hint = document.getElementById('search-hint');
  const badge = document.getElementById('count-badge');

  if(allNotices.length === 0){
    container.innerHTML = `
      <div class="state">
        <div class="state-icon">📂</div>
        <div class="state-title">Aucune notice trouvée</div>
        <div class="state-sub">Le dossier notices/ est vide sur GitHub.</div>
      </div>`;
    hint.textContent = 'Aucune notice';
    badge.style.display = 'none';
    return;
  }

  if(filtered.length === 0){
    container.innerHTML = `
      <div class="state">
        <div class="state-icon">🔎</div>
        <div class="state-title">Aucun résultat</div>
        <div class="state-sub">Aucune notice ne correspond à "<strong>${query}</strong>"</div>
      </div>`;
    hint.textContent = 'Aucun résultat';
    badge.textContent = '0';
    badge.style.display = 'inline';
    return;
  }

  hint.textContent = query ? `${filtered.length} résultat${filtered.length > 1 ? 's' : ''}` : `${allNotices.length} notices disponibles`;
  badge.textContent = filtered.length;
  badge.style.display = query ? 'inline' : 'none';

  container.innerHTML = filtered.map((n, i) => `
    <a class="notice-card" href="${n.githubUrl}" target="_blank" style="animation-delay:${Math.min(i*30, 300)}ms">
      <div class="notice-icon">📄</div>
      <div class="notice-info">
        <div class="notice-ref">${highlight(n.ref, query)}${n.label ? '' : ''}</div>
        ${n.label ? `<div class="notice-name">${highlight(n.label, query)}${n.year ? ' · ' + n.year : ''}</div>` : ''}
      </div>
      <span class="notice-arrow">›</span>
    </a>
  `).join('');
}

// Search avec debounce
let searchTimer;
document.getElementById('search').addEventListener('input', e => {
  clearTimeout(searchTimer);
  searchQuery = e.target.value;
  searchTimer = setTimeout(renderAll, 80);
});

// Refresh
document.getElementById('refresh-btn').addEventListener('click', () => {
  const btn = document.getElementById('refresh-btn');
  btn.classList.add('spinning');
  setTimeout(() => btn.classList.remove('spinning'), 600);
  loadNotices(true);
});

// Init
loadNotices();
</script>

</body>
</html>
